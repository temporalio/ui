# enable-template
# Set TEMPORAL_UI_EXTENSION_EXAMPLE_ENABLED=true to load the runnable example
# from examples/custom-ui-extension. It intentionally has no context or action
# permissions because loopback HTTP is only supported for unprivileged demos.
publicPath:
port: 8081
enableUi: true
cors:
  cookieInsecure: false
  allowOrigins:
    - "*"
  unsafeAllowAllOrigins: true
refreshInterval: 1m
defaultNamespace: default
showTemporalSystemNamespace: false
feedbackUrl:
disableNewsFetch: false
navCollapsedByDefault: false
disableWriteActions: false
workflowTerminateDisabled: false
workflowCancelDisabled: false
workflowSignalDisabled: false
workflowUpdateDisabled: false
workflowResetDisabled: false
workflowPauseDisabled: false
batchActionsDisabled: false
startWorkflowDisabled: false
hideWorkflowQueryErrors: false
refreshWorkflowCountsDisabled: false
activityCommandsDisabled: false
auth:
  enabled: false
  redirectToProvider: false
  providers:
    - label: Auth0 oidc # for internal use; in future may expose as button text
      type: oidc # for futureproofing; only oidc is supported today
      providerUrl: https://myorg.us.auth0.com/
      issuerUrl: "" # needed if the Issuer Url and the Provider Url are different
      clientId: xxxxxxxxxxxxxxxxxxxx
      clientSecret: xxxxxxxxxxxxxxxxxxxx
      scopes:
        - openid
        - profile
        - email
      callbackUrl: http://localhost:8080/auth/sso/callback
      options: # added as URL query params when redirecting to auth provider
        audience: myorg-dev
        organization: org_xxxxxxxxxxxx
        invitation:
tls:
  caFile:
  certFile:
  keyFile:
  caData:
  certData:
  keyData:
  enableHostVerification: false
  serverName:
uiServerTLS:
  certFile:
  keyFile:
codec:
  endpoint:
  passAccessToken: false
  includeCredentials: false
  defaultErrorMessage:
  defaultErrorLink:
forwardHeaders: # can be used to pass additional HTTP headers from HTTP requests to Temporal gRPC backend
  - X-Forwarded-For
customUi:
  enabled: {{ if or (eq (env "TEMPORAL_UI_EXTENSION_EXAMPLE_ENABLED") "true") (eq (env "TEMPORAL_UI_EXTENSION_AUTH_EXAMPLE_ENABLED") "true") }}true{{ else }}false{{ end }}
  iframeExtensions:
    - id: local-extension-example
      title: Local extension example
      slot: app.top-nav.sub-nav
      src: http://127.0.0.1:8090/
      allowedOrigin: http://127.0.0.1:8090
      sizing:
        defaultHeight: 112
        minHeight: 72
        maxHeight: 200
      permissions: []
    # Loads the runnable example from examples/custom-ui-extension-with-auth,
    # which signs in against the sample OIDC server with the device flow. It is
    # also unprivileged: loopback HTTP extensions never receive permissions.
    - id: local-extension-auth-example
      title: Local extension auth example
      slot: app.top-nav.sub-nav
      src: http://127.0.0.1:8091/
      allowedOrigin: http://127.0.0.1:8091
      sizing:
        defaultHeight: 120
        minHeight: 72
        maxHeight: 240
      permissions: []
{{- $typesafeKey := env "TEMPORAL_TYPESAFE_API_KEY" | default (env "TEMPORAL_NL_SEARCH_API_KEY") }}
typesafe: # the TypeSafe API, shared by nlSearch and historyReview: one deployment has one key
  # The template escapes HTML and writes the value as YAML without quotes. A key that has
  # one of & < > ' " + or ": " or " #" does not survive (standard base64 has +): put that key in a config file,
  # as a quoted string, in place of the variable. The characters = / - _ . are safe.
  # Set TEMPORAL_TYPESAFE_API_KEY to turn both features on. TEMPORAL_NL_SEARCH_API_KEY is the fallback.
  apiKey: {{ $typesafeKey }} # secret, never sent to the browser
  model: jev-latest
  baseUrl: https://api.typesafe.ai
  timeout: 5s
  rateLimit: # protects the quota of the API key; an empty or zero value selects the default
    disabled: false # the only way to turn the limit off
    requestsPerMinute: 30 # for each caller (one Authorization header, or one IP)
    burst: 10
    # For all callers together. With the defaults, this limit is the one that binds when
    # more than about 10 users are active at the same time (300 / 30). Keep it at or above
    # requestsPerMinute, and below the quota of the API key. One history review costs
    # one request for each 50 distinct rows.
    deploymentRequestsPerMinute: 300
nlSearch: # natural-language workflow search
  enabled: {{ if $typesafeKey }}true{{ else }}false{{ end }}
historyReview: # "Review with Jev" on the workflow event history
  enabled: {{ if $typesafeKey }}true{{ else }}false{{ end }}
