<!doctype html>
<html
  lang="en"
  data-theme="light"
  data-palette-default="precision"
  data-density="compact"
  data-visual-version="v2"
  data-visual-default="%sveltekit.env.VITE_TEMPORAL_UI_VISUAL_VERSION%"
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    %sveltekit.head%
    <!-- Keep this single-line script in sync with PREPAINT_CSP_HASH in svelte.config.js. -->
    <!-- prettier-ignore -->
    <script data-prepaint>(()=>{const root=document.documentElement;const read=(key)=>{try{return localStorage.getItem(key)}catch{return null}};const validVersion=(value)=>value==='legacy'||value==='v2';const query=new URLSearchParams(location.search).get('visual');const rawVersion=read('visual version');let storedVersion=rawVersion;try{storedVersion=JSON.parse(rawVersion??'null')}catch{}const configured=root.dataset.visualDefault;root.dataset.visualVersion=validVersion(query)?query:validVersion(storedVersion)?storedVersion:validVersion(configured)?configured:'v2';const rawTheme=read('dark mode');let preference='system';try{const parsed=JSON.parse(rawTheme??'null');if(parsed===true||parsed===false||parsed==='system')preference=parsed}catch{}const dark=preference===true||(preference==='system'&&(window.matchMedia?.('(prefers-color-scheme: dark)')?.matches??false));root.dataset.theme=dark?'dark':'light';const validPalette=(value)=>typeof value==='string'&&/^[a-z][a-z0-9-]{0,31}$/.test(value);const rawPalette=read('color palette');let storedPalette=null;try{storedPalette=JSON.parse(rawPalette??'null')}catch{}const paletteDefault=root.dataset.paletteDefault;if(validPalette(storedPalette))root.dataset.palette=storedPalette;else if(validPalette(paletteDefault))root.dataset.palette=paletteDefault})();</script>
    <style>
      html {
        background-color: rgb(var(--color-surface-background, 245 247 250));
        color: rgb(var(--color-text-primary, 23 26 34));
      }
      body {
        margin: 0;
        background-color: rgb(var(--color-surface-background, 245 247 250));
        color: rgb(var(--color-text-primary, 23 26 34));
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background-color: rgb(var(--color-surface-background, 12 15 20));
        color: rgb(var(--color-text-primary, 237 241 247));
      }
    </style>
  </head>

  <body>
    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
