name: Version Bump

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Version bump mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - manual
          - dry-run
      version_type:
        description: 'Version type (used in manual mode)'
        required: false
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch
      specific_version:
        description: 'Specific version to set (e.g., 2.38.0) - overrides version_type'
        required: false
        type: string
      force_update:
        description: 'Force update (override validation checks)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.calculate-version.outputs.version-changed }}
      new-version: ${{ steps.calculate-version.outputs.new-version }}
      pr-number: ${{ steps.create-pr.outputs.pull-request-number }}
      pr-url: ${{ steps.create-pr.outputs.pull-request-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate current versions are in sync
        id: validate-sync
        uses: ./.github/actions/validate-version-sync
        with:
          force: ${{ inputs.force_update }}

      - name: Get last version tag
        id: last-tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "last-tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "Last version tag: $LAST_TAG"

      - name: Check for go.temporal.io/api upgrade
        id: check-api-upgrade
        if: inputs.mode == 'auto' || inputs.mode == 'dry-run'
        env:
          LAST_TAG: ${{ steps.last-tag.outputs.last-tag }}
        run: |
          api_version() {
            awk '$1 == "go.temporal.io/api" { print $2; exit }'
          }

          # v1.63.5, v1.64.0-rc1 and v1.63.5-0.20240101-abc all reduce to "1 63 5"
          version_core() {
            printf '%s' "${1#v}" | sed -E 's/[-+].*$//' | tr '.' ' '
          }

          # Succeeds when $2 is a higher version than $1
          is_upgrade() {
            local -a previous current
            read -r -a previous <<<"$(version_core "$1")"
            read -r -a current <<<"$(version_core "$2")"
            local i p c
            for i in 0 1 2; do
              p=${previous[$i]:-0}
              c=${current[$i]:-0}
              [[ "$p" =~ ^[0-9]+$ ]] || p=0
              [[ "$c" =~ ^[0-9]+$ ]] || c=0
              (( c > p )) && return 0
              (( c < p )) && return 1
            done
            return 1
          }

          CURRENT=$(api_version < server/go.mod)
          if [[ -z "$CURRENT" ]]; then
            echo "⚠️ No go.temporal.io/api require found in server/go.mod, skipping check"
          fi

          if PREVIOUS_MOD=$(git show "$LAST_TAG:server/go.mod" 2>/dev/null); then
            PREVIOUS=$(printf '%s\n' "$PREVIOUS_MOD" | api_version)
            if [[ -z "$PREVIOUS" ]]; then
              echo "⚠️ No go.temporal.io/api require found in server/go.mod at $LAST_TAG, skipping check"
            fi
          else
            PREVIOUS=""
            echo "⚠️ Could not read server/go.mod at $LAST_TAG"
          fi

          if [[ -n "$PREVIOUS" && -n "$CURRENT" ]] && is_upgrade "$PREVIOUS" "$CURRENT"; then
            echo "✨ go.temporal.io/api upgraded from $PREVIOUS to $CURRENT since $LAST_TAG"
            echo "upgraded=true" >> $GITHUB_OUTPUT
          else
            echo "upgraded=false" >> $GITHUB_OUTPUT
          fi

      - name: Analyze merged PRs since last version
        id: analyze-prs
        if: inputs.mode == 'auto' || inputs.mode == 'dry-run'
        uses: temporalio/pack-dependency-actions/analyze-commits-for-bump@bf23e855ebebec9a0be45eff67c88a4189210c55 # v1.5.0
        with:
          from-ref: ${{ steps.last-tag.outputs.last-tag }}
          to-ref: HEAD

      - name: Resolve bump type
        id: resolve-bump
        if: inputs.mode == 'auto' || inputs.mode == 'dry-run'
        env:
          ANALYZED_BUMP_TYPE: ${{ steps.analyze-prs.outputs.bump-type }}
          API_UPGRADED: ${{ steps.check-api-upgrade.outputs.upgraded }}
        run: |
          BUMP_TYPE="$ANALYZED_BUMP_TYPE"

          if [[ "$API_UPGRADED" == "true" && "$BUMP_TYPE" == "patch" ]]; then
            echo "⬆️ go.temporal.io/api was upgraded, raising patch to minor"
            BUMP_TYPE="minor"
          fi

          echo "Resolved bump type: $BUMP_TYPE (from commits: $ANALYZED_BUMP_TYPE)"
          echo "bump-type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Get HEAD SHA for changelog
        id: get-head-sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: generate-changelog
        if: steps.last-tag.outputs.last-tag != ''
        uses: temporalio/pack-dependency-actions/generate-changelog@bf23e855ebebec9a0be45eff67c88a4189210c55 # v1.5.0
        with:
          repository: ${{ github.repository }}
          from-sha: ${{ steps.last-tag.outputs.last-tag }}
          to-sha: ${{ steps.analyze-prs.outputs.latest-sha || steps.get-head-sha.outputs.sha }}
          format: markdown

      - name: Calculate new version
        id: calculate-version
        uses: temporalio/pack-dependency-actions/calculate-semantic-version@bf23e855ebebec9a0be45eff67c88a4189210c55 # v1.5.0
        with:
          current-version: ${{ steps.validate-sync.outputs.current-version }}
          bump-type: ${{ inputs.mode == 'manual' && inputs.version_type || steps.resolve-bump.outputs.bump-type }}
          specific-version: ${{ inputs.specific_version }}

      - name: Dry run summary
        if: inputs.mode == 'dry-run'
        env:
          CURRENT_VERSION: ${{ steps.validate-sync.outputs.current-version }}
          NEW_VERSION: ${{ steps.calculate-version.outputs.new-version }}
          SPECIFIC_VERSION: ${{ inputs.specific_version }}
          INPUT_MODE: ${{ inputs.mode }}
          BUMP_TYPE: ${{ steps.resolve-bump.outputs.bump-type }}
          API_UPGRADED: ${{ steps.check-api-upgrade.outputs.upgraded }}
          VERSION_CHANGED: ${{ steps.calculate-version.outputs.version-changed }}
          CHANGELOG: ${{ steps.generate-changelog.outputs.changelog }}
        run: |
          echo "## 🔍 Dry Run Results"
          echo ""
          echo "**Current Version:** $CURRENT_VERSION"
          echo "**New Version:** $NEW_VERSION"
          if [[ -n "$SPECIFIC_VERSION" ]]; then
            echo "**Version Source:** Specific version (manual override)"
            echo "**Specified Version:** $SPECIFIC_VERSION"
          else
            VERSION_SOURCE="Auto-detected from commits"
            if [ "$INPUT_MODE" = "manual" ]; then
              VERSION_SOURCE="Manual bump type"
            fi
            echo "**Version Source:** $VERSION_SOURCE"
            echo "**Bump Type:** $BUMP_TYPE"
            if [[ "$API_UPGRADED" == "true" ]]; then
              echo "**go.temporal.io/api:** upgraded since last version (minimum minor)"
            fi
          fi
          echo "**Version Changed:** $VERSION_CHANGED"
          echo ""
          if [[ -n "$CHANGELOG" ]]; then
            echo "### 📝 Changes Since Last Version"
            echo "$CHANGELOG"
            echo ""
          fi
          echo "**Note:** This was a dry run. No files were modified."

      - name: Update version files
        if: inputs.mode != 'dry-run' && steps.calculate-version.outputs.version-changed == 'true'
        id: update-files
        uses: ./.github/actions/update-version-files
        with:
          new-version: ${{ steps.calculate-version.outputs.new-version }}

      - name: Generate token for cross-repo access
        id: generate_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.TEMPORAL_CICD_APP_ID }}
          private-key: ${{ secrets.TEMPORAL_CICD_PRIVATE_KEY }}
          owner: temporalio
          repositories: ui

      - name: Create Pull Request
        if: inputs.mode != 'dry-run' && steps.calculate-version.outputs.version-changed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          branch: version-bump-${{ steps.calculate-version.outputs.new-version }}
          delete-branch: true
          reviewers: ${{ github.actor }}
          committer: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          draft: always-true
          commit-message: |
            chore: bump version to ${{ steps.calculate-version.outputs.new-version }}

            Auto-generated version bump from ${{ steps.validate-sync.outputs.current-version }} to ${{ steps.calculate-version.outputs.new-version }}

            ${{ inputs.specific_version && format('Specific version: {0}', inputs.specific_version) || format('Bump type: {0}', inputs.mode == 'manual' && inputs.version_type || steps.resolve-bump.outputs.bump-type) }}
            ${{ steps.check-api-upgrade.outputs.upgraded == 'true' && 'go.temporal.io/api: upgraded since last version (minimum minor)' || '' }}

            Changes included:
            ${{ steps.generate-changelog.outputs.changelog || 'No commits since last version' }}
          title: 'chore: bump version to ${{ steps.calculate-version.outputs.new-version }}'
          body: |
            ## 🚀 Version Bump to ${{ steps.calculate-version.outputs.new-version }}

            This PR updates the version from `${{ steps.validate-sync.outputs.current-version }}` to `${{ steps.calculate-version.outputs.new-version }}`.

            ### 📋 Files Updated
            - `package.json`
            - `server/server/version/version.go`

            ### 📝 Bump Details
            ${{ inputs.specific_version && format('- **Version Source:** Specific version override\n- **Specified Version:** {0}', inputs.specific_version) || format('- **Bump Type:** {0}', inputs.mode == 'manual' && inputs.version_type || steps.resolve-bump.outputs.bump-type) }}
            ${{ steps.check-api-upgrade.outputs.upgraded == 'true' && '- **go.temporal.io/api:** upgraded since last version (minimum minor)' || '' }}
            - **Mode:** ${{ inputs.mode }}

            ### 📖 Changes Since Last Version
            ${{ steps.generate-changelog.outputs.changelog || 'No commits found since last version' }}

            ${{ inputs.specific_version && '**Note:** This version was manually specified rather than calculated from commit history.' || '' }}

            ---
            🤖 This PR was automatically created by the Version Bump workflow.

      - name: Summary
        if: inputs.mode != 'dry-run'
        run: |
          if [[ "${{ steps.calculate-version.outputs.version-changed }}" == "true" ]]; then
            echo "🎉 Version bump completed!"
            echo "- Old version: ${{ steps.validate-sync.outputs.current-version }}"
            echo "- New version: ${{ steps.calculate-version.outputs.new-version }}"
            if [[ -n "${{ steps.create-pr.outputs.pull-request-number }}" ]]; then
              echo "- Pull Request: #${{ steps.create-pr.outputs.pull-request-number }}"
              echo "- Pull Request URL: ${{ steps.create-pr.outputs.pull-request-url }}"
            fi
          else
            echo "ℹ️ No version change was needed."
          fi
