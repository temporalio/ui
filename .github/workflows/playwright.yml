name: Playwright
run-name: ${{github.event.pull_request.title}} (${{ github.event.pull_request.number }}) by @${{ github.triggering_actor }} (Attempt ${{ github.run_attempt }})

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codefreeze-*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'CODEOWNERS'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Integration tests
        run: pnpm test:integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-integration
          path: |
            ./playwright-report/
            ./test-results/
          retention-days: 30
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node
      - name: Build UI
        run: pnpm build:server
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
          cache: true
          check-latest: true
      - name: Build UI Server
        working-directory: server
        run: make build
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run E2E tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-e2e
          path: |
            ./playwright-report/
            ./test-results/
          retention-days: 30
