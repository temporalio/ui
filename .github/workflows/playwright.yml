name: Playwright
run-name: ${{github.event.pull_request.title}} (${{ github.event.pull_request.number }}) by @${{ github.triggering_actor }} (Attempt ${{ github.run_attempt }})

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codefreeze-*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'CODEOWNERS'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Integration tests
        run: pnpm test:integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-integration
          path: |
            ./playwright-report/
            ./test-results/
          retention-days: 30
  route-accessibility-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run route accessibility tests
        run: pnpm test:accessibility
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-accessibility
          path: |
            ./playwright-report/
            ./test-results/
          retention-days: 30
  redesign-visual-tests:
    timeout-minutes: 30
    # The job becomes blocking once the first reviewed PNG baselines are committed.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run redesign visual tests
        run: pnpm test:visual
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-visual
          path: |
            ./playwright-report/
            ./test-results/
          retention-days: 30
  redesign-cross-browser-smoke-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node
      - name: Install cross-browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run blocking cross-browser redesign smoke tests
        run: pnpm test:redesign-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-redesign-smoke
          path: |
            ./playwright-report/
            ./test-results/
          retention-days: 30
  storybook-accessibility-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Storybook
        run: pnpm stories:build
      - name: Run Storybook interaction and accessibility tests
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 6006 --strictPort --outDir storybook-static &
          storybook_server_pid=$!
          trap 'kill "$storybook_server_pid"' EXIT
          pnpm exec wait-port -t 120000 127.0.0.1:6006
          pnpm stories:test --url http://127.0.0.1:6006 --ci
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node
      - name: Build UI
        run: pnpm build:server
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
          cache: true
          check-latest: true
      - name: Build UI Server
        working-directory: server
        run: make build
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run E2E tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-e2e
          path: |
            ./playwright-report/
            ./test-results/
          retention-days: 30
