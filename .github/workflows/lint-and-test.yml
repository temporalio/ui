name: Run Tests, Lint, and Check Types
run-name: ${{github.event.pull_request.title}} (${{ github.event.pull_request.number }}) by @${{ github.triggering_actor }} (Attempt ${{ github.run_attempt }})

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codefreeze-*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'CODEOWNERS'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node
      - name: Check package exports
        run: pnpm check:exports
      - name: Lint
        run: pnpm run --if-present lint:ci
  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node
      - name: Check Types
        run: pnpm run check
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node
      - name: Run Unit Tests
        run: pnpm test
